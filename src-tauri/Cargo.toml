[package]
name = "runningdo"
version = "1.4.2"
description = "一张纸上的倒计时与日程"
authors = ["charlezk9"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "runningdo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "RunningDO"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
